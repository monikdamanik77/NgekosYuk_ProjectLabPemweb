<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Ngekos Yuk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] }, colors: { sky: { 50: '#EFF6FF', 100: '#DBEAFE', 200: '#BFDBFE', 500: '#2F6FE0', 600: '#1D5FD1', 700: '#1749A8', 800: '#14357A' } } } } }</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-br from-sky-100 via-sky-50 to-blue-100 bg-fixed text-gray-800 font-sans min-h-screen flex flex-col justify-between">
    <header class="bg-white/80 backdrop-blur border-b border-sky-100 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="index.html" class="text-xl font-extrabold text-sky-600 tracking-tight">Ngekos Yuk</a>
            <a href="index.html" class="text-sm font-medium text-gray-600 hover:text-sky-600">Beranda</a>
        </div>
    </header>
    <main class="max-w-md mx-auto px-6 py-14 w-full flex-grow">
        <div class="bg-white border border-sky-100 rounded-3xl p-8 shadow-sm">
            <h1 class="text-2xl font-bold text-gray-900 mb-1">Masuk</h1>
            <p class="text-sm text-gray-500 mb-6">Khusus penghuni dan pemilik kos. Pengunjung bisa memesan kamar tanpa masuk.</p>
            <form id="form-masuk" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                    <input name="email" type="email" class="w-full bg-white border border-gray-200 text-gray-800 text-sm rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-sky-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Kata sandi</label>
                    <div class="relative">
                        <input name="sandi" id="input-sandi" type="password" class="w-full bg-white border border-gray-200 text-gray-800 text-sm rounded-xl px-4 py-2.5 pr-10 focus:outline-none focus:ring-2 focus:ring-sky-500" required>
                        <button type="button" id="toggle-sandi" class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none">
                            <i class="fa-solid fa-eye" id="icon-sandi"></i>
                        </button>
                    </div>
                </div>
                <p id="galat" class="text-sm text-red-600" role="alert"></p>
                <button type="submit" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-medium text-sm px-6 py-3 rounded-xl shadow transition">Masuk</button>
            </form>
            <div class="mt-6 bg-purple-50 text-purple-800 text-xs rounded-xl p-4 leading-relaxed">
                <strong>Akun contoh (simulasi):</strong><br>
                Pemilik: ownerku1@gmail.com / owner123<br>
                Penghuni: budisantosoo@gmail.com / tenant123
            </div>
        </div>
    </main>
    <footer class="text-center py-6 text-xs text-gray-500 border-t border-sky-100 bg-white/70">
        &copy; 2026 Ngekos Yuk.<br>
        <span class="font-medium text-sky-700 mt-1 inline-block">“Temukan tempat nyaman untuk pulang.”</span>
    </footer>
    <script src="script.js"></script>
</body>
</html>
